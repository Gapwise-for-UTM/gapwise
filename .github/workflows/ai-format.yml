name: AI branch formatter

on:
  push:
    branches: [feat/ai-delegation-client]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-delegation-client
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply repository lint and formatting rules
        run: |
          bunx eslint --fix src/features/ai src/routes/oauth.consent.tsx tests/ai-delegation.test.ts
          bunx prettier --write src/features/ai src/routes/oauth.consent.tsx tests/ai-delegation.test.ts
      - name: Commit mechanical formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/ai src/routes/oauth.consent.tsx tests/ai-delegation.test.ts
          git commit -m "chore: format final AI integration changes"
          git push origin HEAD:feat/ai-delegation-client
