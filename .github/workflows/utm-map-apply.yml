name: Apply canonical UTM map refactor

on:
  push:
    branches: [fix/utm-map-region-foundation]
    paths:
      - "scripts/apply-canonical-campus-map.ts"
      - ".github/workflows/utm-map-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/utm-map-region-foundation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply deterministic CampusMap refactor
        run: bun scripts/apply-canonical-campus-map.ts
      - name: Format changed map file
        run: bunx prettier --write src/components/CampusMap.tsx
      - name: Verify generated TypeScript
        run: bun run typecheck
      - name: Commit the generated refactor
        run: |
          git add src/components/CampusMap.tsx
          if git diff --cached --quiet; then
            echo "CampusMap already matches the canonical geometry architecture."
            exit 0
          fi
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git commit -m "fix: make UTM building selection geometry-exact"
          git push origin HEAD:fix/utm-map-region-foundation
