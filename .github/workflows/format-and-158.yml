name: Format AND-158 docs

on:
  push:
    branches:
      - trust/and-158-incident-response

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/INCIDENT_RESPONSE.md docs/OPERATIONS.md docs/DISASTER_RECOVERY.md
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/INCIDENT_RESPONSE.md docs/OPERATIONS.md docs/DISASTER_RECOVERY.md
            git commit -m "style: format AND-158 docs"
            git push
          fi
