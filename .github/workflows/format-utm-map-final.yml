name: Final format UTM map branch

on:
  push:
    branches: [fix/utm-map-region-foundation]
    paths:
      - ".github/workflows/format-utm-map-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/utm-map-region-foundation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format repository
        run: bunx prettier --write .
      - name: Commit formatting
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git commit -m "style: finalize UTM map formatting"
          git push origin HEAD:fix/utm-map-region-foundation
