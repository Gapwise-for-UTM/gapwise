name: AND-120/121 routing diagnosis

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-120-121-diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Inspect IB to DV shortest route
        run: |
          cat > /tmp/diagnose-route.ts <<'TS'
          import { DEFAULT_ROUTE_PREFERENCES } from "${{ github.workspace }}/src/config/routing.ts";
          import { UTM_ROUTING_GRAPH } from "${{ github.workspace }}/src/data/utm/campus.ts";
          import { findBestRoute } from "${{ github.workspace }}/src/features/routing/engine.ts";

          function endpoints(code: string) {
            return UTM_ROUTING_GRAPH.nodes
              .filter((node) => node.kind === "building-entrance" && node.buildingCode === code)
              .map((node) => node.id)
              .sort();
          }

          for (const [from, to] of [["IB", "DV"], ["DV", "IB"]] as const) {
            const route = findBestRoute(
              UTM_ROUTING_GRAPH,
              endpoints(from),
              endpoints(to),
              { ...DEFAULT_ROUTE_PREFERENCES, mode: "fastest" },
            );
            console.log(`ROUTE ${from}->${to}`);
            console.log(`starts=${JSON.stringify(endpoints(from))}`);
            console.log(`targets=${JSON.stringify(endpoints(to))}`);
            if (!route) {
              console.log("NO ROUTE");
              continue;
            }
            console.log(`distance=${route.totalDistanceMeters.toFixed(2)}m seconds=${route.estimatedSeconds.toFixed(2)}`);
            console.log(`nodes=${route.nodes.map((node) => node.id).join(" -> ")}`);
            console.log(`edges=${route.edges.map((edge) => `${edge.id}(${edge.distanceMeters.toFixed(1)}m)`).join(" -> ")}`);
            console.log(`coordinates=${JSON.stringify(route.coordinates)}`);
          }
          TS
          bun /tmp/diagnose-route.ts
      - name: Find suspicious near-crossing pedestrian segments
        run: |
          python3 - <<'PY'
          import json, math
          from pathlib import Path

          nodes_doc = json.loads(Path("src/data/utm/outdoor-nodes.geojson").read_text())
          edges_doc = json.loads(Path("src/data/utm/outdoor-edges.json").read_text())
          nodes = {f["id"]: tuple(f["geometry"]["coordinates"]) for f in nodes_doc["features"]}
          edges = [e for e in edges_doc["edges"] if e["environment"] == "outdoor" and e["from"] in nodes and e["to"] in nodes]

          lat0 = 43.549
          sx = 111320 * math.cos(math.radians(lat0))
          sy = 110540
          def xy(p): return (p[0]*sx, p[1]*sy)
          def point_seg_distance(p,a,b):
              px,py=xy(p); ax,ay=xy(a); bx,by=xy(b)
              vx,vy=bx-ax,by-ay; wx,wy=px-ax,py-ay
              vv=vx*vx+vy*vy
              if vv == 0: return math.hypot(px-ax,py-ay),0.0
              t=max(0.0,min(1.0,(wx*vx+wy*vy)/vv))
              qx,qy=ax+t*vx,ay+t*vy
              return math.hypot(px-qx,py-qy),t
          def orient(a,b,c):
              ax,ay=xy(a); bx,by=xy(b); cx,cy=xy(c)
              return (bx-ax)*(cy-ay)-(by-ay)*(cx-ax)
          def proper_intersection(a,b,c,d):
              o1,o2,o3,o4=orient(a,b,c),orient(a,b,d),orient(c,d,a),orient(c,d,b)
              return (o1*o2 < 0) and (o3*o4 < 0)

          suspicious=[]
          for i,e1 in enumerate(edges):
              a,b=nodes[e1["from"]],nodes[e1["to"]]
              ids1={e1["from"],e1["to"]}
              for e2 in edges[i+1:]:
                  if ids1 & {e2["from"],e2["to"]}: continue
                  c,d=nodes[e2["from"]],nodes[e2["to"]]
                  if proper_intersection(a,b,c,d):
                      suspicious.append((0.0,"cross",e1["id"],e2["id"]))
                      continue
                  vals=[]
                  for p,label in [(a,e1["from"]),(b,e1["to"])]:
                      dist,t=point_seg_distance(p,c,d)
                      if 0.02 < t < 0.98: vals.append((dist,label,e2["id"]))
                  for p,label in [(c,e2["from"]),(d,e2["to"])]:
                      dist,t=point_seg_distance(p,a,b)
                      if 0.02 < t < 0.98: vals.append((dist,label,e1["id"]))
                  if vals:
                      dist,label,other=min(vals)
                      if dist <= 1.5:
                          suspicious.append((dist,"near",label,other))
          suspicious.sort()
          print(f"SUSPICIOUS_COUNT={len(suspicious)}")
          for row in suspicious[:100]: print("SUSPICIOUS", row)
          PY
