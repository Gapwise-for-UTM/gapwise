name: Format UTM map branch

on:
  push:
    branches: [fix/utm-map-region-foundation]
    paths:
      - ".github/workflows/format-map-branch.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/utm-map-region-foundation
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format branch changes
        run: bunx prettier --write scripts/diagnose-building-overlaps.ts scripts/fetch-reviewed-osm-ways.ts scripts/generate-building-footprints.ts scripts/inspect-utm-building-relations.ts src/data/utm/building-footprints.ts src/data/utm/campus-models.ts src/data/utm/footprint-fragments.ts tests/building-footprints.test.ts tests/campus-region.test.ts docs/CAMPUS_MAP_GEOMETRY.md .github/workflows/utm-map-data.yml
      - name: Commit formatting
        run: |
          git add scripts src/data/utm tests docs .github/workflows/utm-map-data.yml
          if git diff --cached --quiet; then
            echo "Map branch formatting is already clean."
            exit 0
          fi
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git commit -m "style: format UTM map geometry work"
          git push origin HEAD:fix/utm-map-region-foundation
