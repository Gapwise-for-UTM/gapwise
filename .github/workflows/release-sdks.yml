name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry target
        required: true
        default: verify
        type: choice
        options:
          - verify
          - npm
          - pypi
          - both

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - name: Verify JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
      - name: Verify Python SDK
        run: |
          python -m pip install './sdk/python[test]'
          black --check sdk/python
          ruff check sdk/python
          python -m pytest sdk/python
          python -m build sdk/python
          python -m twine check sdk/python/dist/*

  publish-npm:
    name: Publish @gapwise/sdk
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'npm' || inputs.target == 'both') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Build JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
      - name: Require trusted-publishing capable npm
        run: |
          npm install --global npm@11.6.2
          node --version
          npm --version
      - name: Publish JavaScript SDK
        working-directory: sdk/javascript
        run: npm publish --access public

  publish-pypi:
    name: Publish gapwise to PyPI
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'pypi' || inputs.target == 'both') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
      - name: Publish Python SDK
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: sdk/python/dist
