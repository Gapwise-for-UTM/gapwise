name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry target
        required: true
        default: verify
        type: choice
        options:
          - verify
          - npm
          - pypi
          - both

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - name: Verify JavaScript SDK artifact and clean install
        run: |
          set -euo pipefail
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
          bun pm pack
          PACKAGE=$(find . -maxdepth 1 -name '*.tgz' -printf '%f\n' | head -n 1)
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | tee "$RUNNER_TEMP/npm-package-contents.txt"
          if grep -Eiq '(^|/)(\.env($|\.)|\.npmrc$|[^/]*\.(pem|key)$|credentials?($|\.)|secrets?($|\.))' "$RUNNER_TEMP/npm-package-contents.txt"; then
            echo "Unexpected credential-like file in npm artifact." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/js-consumer"
          cd "$RUNNER_TEMP/js-consumer"
          npm init --yes >/dev/null
          npm install "$GITHUB_WORKSPACE/sdk/javascript/$PACKAGE"
          node --input-type=module -e 'import { Gapwise } from "@gapwise/sdk"; if (!(new Gapwise({ fetch: globalThis.fetch }) instanceof Gapwise)) process.exit(1)'
      - name: Verify Python SDK artifact and clean install
        run: |
          set -euo pipefail
          python -m pip install './sdk/python[test]'
          black --check sdk/python
          ruff check sdk/python
          python -m pytest sdk/python
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/pip" install sdk/python/dist/*.whl
          "$RUNNER_TEMP/python-consumer/bin/python" -c 'from gapwise import Gapwise, AsyncGapwise; assert Gapwise and AsyncGapwise'
          unzip -l sdk/python/dist/*.whl | tee "$RUNNER_TEMP/python-package-contents.txt"
          grep 'gapwise/py.typed' "$RUNNER_TEMP/python-package-contents.txt"
          if grep -Eiq '(^|/)(\.env($|\.)|\.pypirc$|[^/]*\.(pem|key)$|credentials?($|\.)|secrets?($|\.))' "$RUNNER_TEMP/python-package-contents.txt"; then
            echo "Unexpected credential-like file in Python artifact." >&2
            exit 1
          fi

  publish-npm:
    name: Publish @gapwise/sdk
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'npm' || inputs.target == 'both') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Build JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
      - name: Require trusted-publishing capable npm
        run: |
          npm install --global npm@11.6.2
          node --version
          npm --version
      - name: Publish JavaScript SDK
        working-directory: sdk/javascript
        run: npm publish --access public

  publish-pypi:
    name: Publish gapwise to PyPI
    if: ${{ github.ref == 'refs/heads/main' && (inputs.target == 'pypi' || inputs.target == 'both') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
      - name: Publish Python SDK
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist
