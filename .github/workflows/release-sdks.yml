name: Release SDKs

on:
  workflow_dispatch:
    inputs:
      target:
        description: Registry target
        required: true
        default: verify
        type: choice
        options:
          - verify
          - npm
          - github
          - jsr
          - pypi
          - python-github
          - javascript
          - both
          - all
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-sdks.yml"
      - "sdk/javascript/package.json"
      - "sdk/javascript/jsr.json"
      - "sdk/python/pyproject.toml"
    tags:
      - "python-v*"

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: bun install --frozen-lockfile
      - name: Verify TypeScript registry versions agree
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const npmPackage = JSON.parse(readFileSync("sdk/javascript/package.json", "utf8"));
          const jsrPackage = JSON.parse(readFileSync("sdk/javascript/jsr.json", "utf8"));
          if (npmPackage.name !== jsrPackage.name) {
            throw new Error(`TypeScript registry package names differ: npm=${npmPackage.name}, jsr=${jsrPackage.name}`);
          }
          if (npmPackage.version !== jsrPackage.version) {
            throw new Error(`TypeScript registry versions differ: npm=${npmPackage.version}, jsr=${jsrPackage.version}`);
          }
          console.log(`TypeScript registry identity verified: ${npmPackage.name}@${npmPackage.version}`);
          NODE
      - name: Verify JavaScript SDK artifact and clean install
        run: |
          set -euo pipefail
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
          bun pm pack
          PACKAGE=$(find . -maxdepth 1 -name '*.tgz' -printf '%f\n' | head -n 1)
          test -n "$PACKAGE"
          tar -tzf "$PACKAGE" | tee "$RUNNER_TEMP/npm-package-contents.txt"
          if grep -Eiq '(^|/)(\.env($|\.)|\.npmrc$|[^/]*\.(pem|key)$|credentials?($|\.)|secrets?($|\.))' "$RUNNER_TEMP/npm-package-contents.txt"; then
            echo "Unexpected credential-like file in npm artifact." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/js-consumer"
          cd "$RUNNER_TEMP/js-consumer"
          npm init --yes >/dev/null
          npm install "$GITHUB_WORKSPACE/sdk/javascript/$PACKAGE"
          node --input-type=module -e 'import { Gapwise } from "@gapwise/sdk"; if (!(new Gapwise({ fetch: globalThis.fetch }) instanceof Gapwise)) process.exit(1)'
      - name: Verify JSR source package and Deno compatibility
        working-directory: sdk/javascript
        run: |
          set -euo pipefail
          npx --yes jsr@0.14.3 publish --dry-run
          deno check --no-config --unstable-sloppy-imports src/index.ts
          deno eval --no-config --unstable-sloppy-imports 'import { Gapwise } from "./src/index.ts"; const client = new Gapwise({ fetch: globalThis.fetch }); if (!(client instanceof Gapwise)) Deno.exit(1)'
      - name: Verify Python SDK artifact and clean install
        run: |
          set -euo pipefail
          python -m pip install './sdk/python[test]'
          black --check sdk/python
          ruff check sdk/python
          python -m pytest sdk/python
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/pip" install sdk/python/dist/*.whl
          "$RUNNER_TEMP/python-consumer/bin/python" -c 'from gapwise import Gapwise, AsyncGapwise; assert Gapwise and AsyncGapwise'
          unzip -l sdk/python/dist/*.whl | tee "$RUNNER_TEMP/python-package-contents.txt"
          grep 'gapwise/py.typed' "$RUNNER_TEMP/python-package-contents.txt"
          if grep -Eiq '(^|/)(\.env($|\.)|\.pypirc$|[^/]*\.(pem|key)$|credentials?($|\.)|secrets?($|\.))' "$RUNNER_TEMP/python-package-contents.txt"; then
            echo "Unexpected credential-like file in Python artifact." >&2
            exit 1
          fi
      - name: Verify Python release tag matches package version
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v') }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#python-v}"
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('sdk/python/pyproject.toml').read_text())['project']['version'])
          PY
          )"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match sdk/python/pyproject.toml version $PACKAGE_VERSION" >&2
            exit 1
          fi

  publish-npm:
    name: Publish @gapwise/sdk to npm
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.target == 'npm' || inputs.target == 'javascript' || inputs.target == 'both' || inputs.target == 'all')) }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Build JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
      - name: Require trusted-publishing capable npm
        run: |
          npm install --global npm@11.6.2
          node --version
          npm --version
      - name: Publish JavaScript SDK
        working-directory: sdk/javascript
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@gapwise/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@gapwise/sdk@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm publish --access public

  publish-jsr:
    name: Publish @gapwise/sdk to JSR
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.target == 'jsr' || inputs.target == 'javascript' || inputs.target == 'all')) }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Publish TypeScript source package
        working-directory: sdk/javascript
        run: npx --yes jsr@0.14.3 publish

  publish-github:
    name: Publish @gapwise-for-utm/sdk to GitHub Packages
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.target == 'github' || inputs.target == 'all') }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@gapwise"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Build JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
      - name: Publish JavaScript SDK to GitHub Packages
        working-directory: sdk/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm pkg set name="@gapwise-for-utm/sdk"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@gapwise-for-utm/sdk@$VERSION" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@gapwise-for-utm/sdk@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm publish --registry=https://npm.pkg.github.com --provenance=false

  publish-pypi:
    name: Publish gapwise to PyPI
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python-v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.target == 'pypi' || inputs.target == 'both' || inputs.target == 'all')) }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
      - name: Publish Python SDK
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: sdk/python/dist

  publish-python-github-release:
    name: Publish Python SDK GitHub release assets
    if: ${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/python-v') || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.target == 'python-github' || inputs.target == 'all')) }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve the tagged Python release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/python-v* ]]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#python-v}"
          else
            VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('sdk/python/pyproject.toml').read_text())['project']['version'])
          PY
          )"
            TAG="python-v$VERSION"
            if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "No existing $TAG tag; there is no tagged Python release to mirror on GitHub yet."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          TAG_VERSION="$(git show "$TAG:sdk/python/pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "$TAG points at Python package version $TAG_VERSION, expected $VERSION" >&2
            exit 1
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git checkout --detach "$TAG"
      - name: Build tagged Python distributions
        if: ${{ steps.release.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
      - name: Publish wheel and source distribution on GitHub
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          WHEEL="gapwise-${RELEASE_VERSION}-py3-none-any.whl"
          SDIST="gapwise-${RELEASE_VERSION}.tar.gz"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq "$WHEEL" <<<"$ASSETS" && grep -Fxq "$SDIST" <<<"$ASSETS"; then
              echo "$RELEASE_TAG already has both Python distribution assets; nothing to do."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" sdk/python/dist/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          gh release create "$RELEASE_TAG" sdk/python/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Gapwise Python SDK ${RELEASE_VERSION}" \
            --notes "Official tagged Python SDK distribution for Gapwise. The canonical Python package is gapwise==${RELEASE_VERSION} on PyPI; this GitHub release mirrors the verified wheel and source distribution from the same python-v${RELEASE_VERSION} tag."
