name: AND-120/121 E2E validation

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-120-121-e2e.yml"
      - "e2e/weekend.e2e.ts"
      - "tests/fixtures/weekend-timetable.ics"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Weekend timetable / gap plan / day route flow
        run: bunx playwright test e2e/weekend.e2e.ts --project=chromium
