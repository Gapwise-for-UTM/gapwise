name: Run AND-120/121 implementation

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-120-121-runner.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Extract and apply implementation script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/and-120-121-implement.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          code = code.replace('if text.count("WEEKDAYS.map((day) => {") != 2:', 'if text.count("WEEKDAYS.map((day) => {") != 3:')
          Path('/tmp/apply-and-120-121.py').write_text(code + "\n")
          PY
          python3 /tmp/apply-and-120-121.py
          # Workflow files are staging machinery and are not part of the feature commit.
          git restore .github/workflows
      - name: Format
        run: bun run format
      - name: Typecheck
        run: bun run typecheck
      - name: Focused unit tests
        run: bun test tests/weekend-schedule.test.ts tests/routing-coordinate-order.test.ts tests/campus-routing-optimality.test.ts tests/timetable-export.test.ts
      - name: Full unit suite
        run: bun test
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Format check
        run: bun run format:check
      - name: Routing audit
        run: bun run routing:audit
      - name: Diff check
        run: git diff --check
      - name: Commit and push feature
        run: |
          git restore .github/workflows
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git add api src sdk public tests e2e
          git diff --cached --stat
          git commit -m "feat: support weekend schedules and correct route geometry" -m "Fixes AND-120\nRelates to AND-121\n\nCo-authored-by: Codex <noreply@openai.com>"
          git push origin HEAD:andrewamuratov/and-120-and-121-weekend-shortest-routes
