name: AND-66 Test Contract Update
on:
  push:
    branches: [feat/and-66-first-run-onboarding-draft]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Update tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/restoration-flow.test.tsx')
          s = p.read_text().replace('Upload your ACORN calendar', 'Import ACORN').replace('Try a demo', 'Try Demo Schedule')
          p.write_text(s)
          Path('tests/upload-panel.test.tsx').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests
          git diff --cached --quiet && exit 0
          git commit -m "test: align onboarding assertions with AND-66"
          git push origin HEAD:feat/and-66-first-run-onboarding-draft
