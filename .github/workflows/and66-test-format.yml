name: AND-66 Test Formatter

on:
  push:
    branches: [feat/and-66-first-run-onboarding-draft]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format and lint final AND-66 tests
        run: |
          bunx prettier --write e2e/and66.e2e.ts tests/upload-panel.test.tsx
          bunx eslint --fix e2e/and66.e2e.ts tests/upload-panel.test.tsx
          bunx prettier --write e2e/and66.e2e.ts tests/upload-panel.test.tsx
          bun run lint
          bunx prettier --check .
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/and66.e2e.ts tests/upload-panel.test.tsx
          git commit -m "style: format final AND-66 tests"
          git push origin HEAD:feat/and-66-first-run-onboarding-draft
