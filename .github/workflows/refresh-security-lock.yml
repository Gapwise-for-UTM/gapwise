name: Refresh security lock

on:
  push:
    branches:
      - chore/retry-vercel-production-2
    paths:
      - .github/workflows/refresh-security-lock.yml
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: chore/retry-vercel-production-2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Refresh patched transitive dependencies
        run: |
          bun pm pkg set overrides.js-yaml=4.3.2
          bun pm pkg set overrides.next=16.3.3
          bun pm pkg set overrides.sharp=0.35.4
          bun install

      - name: Commit refreshed dependency lock
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "No dependency lock changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "fix: refresh vulnerable transitive dependencies"
          git push origin HEAD:chore/retry-vercel-production-2
