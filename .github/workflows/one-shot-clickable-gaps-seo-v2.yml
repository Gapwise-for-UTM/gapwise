name: One-shot clickable gaps and Gapwise SEO v2

on:
  push:
    branches:
      - feat/clickable-gaps-brand-seo

permissions:
  contents: write

concurrency:
  group: clickable-gaps-brand-seo-migration
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/clickable-gaps-brand-seo
          fetch-depth: 0

      - name: Repair migration matcher and apply source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/one-shot-retire-personal-seo.py')
          s = p.read_text()
          s = s.replace('    "              onEditPersonal={personalCommands.openEdit}\\n",\n', '')
          s = s.replace('    "              onDeletePersonal={personalCommands.remove}\\n",\n', '')
          anchor = 'app = app.replace(old_timetable_props, new_timetable_props, 1)\n'
          injected = anchor + 'app = app.replace("              onEditPersonal={personalCommands.openEdit}\\n", "", 1)\napp = app.replace("              onDeletePersonal={personalCommands.remove}\\n", "", 1)\n'
          if anchor not in s:
              raise SystemExit('migration anchor missing')
          s = s.replace(anchor, injected, 1)
          s = s.replace(
              'pointer_start = grid.find("                        onPointerDown={(e) => {", style_start)',
              'pointer_start = grid.find("                        onPointerDown={(e) => {", sorted_anchor)',
          )
          check = 'if any(token in grid for token in ["onCreatePersonal", "onMovePersonal", "onResizePersonal", "detectConflicts", "dragState", "isPersonal"]):\n'
          cleanup = '''for leftover in ["  onCreatePersonal,\\n", "  onMovePersonal,\\n", "  onResizePersonal,\\n", "  onEditPersonal,\\n", "  onDeletePersonal,\\n"]:\n    grid = grid.replace(leftover, "")\noverlay_start = grid.find("                  {dragState && dragState.weekday === day ? (")\nif overlay_start >= 0:\n    overlay_end = grid.find("                </div>\\n              );", overlay_start)\n    if overlay_end < 0:\n        raise RuntimeError("TimetableGrid: personal drag preview end missing")\n    grid = grid[:overlay_start] + grid[overlay_end:]\n''' + check
          if check not in s:
              raise SystemExit('grid cleanup anchor missing')
          s = s.replace(check, cleanup, 1)
          mobile_check = 'if any(token in mobile for token in ["onAddPersonal", "onEditPersonal", "onDeletePersonal", "Add personal item", "isPersonal"]):\n'
          mobile_cleanup = '''for leftover in ["  onAddPersonal,\\n", "  onEditPersonal,\\n", "  onDeletePersonal,\\n"]:\n    mobile = mobile.replace(leftover, "")\n''' + mobile_check
          if mobile_check not in s:
              raise SystemExit('mobile cleanup anchor missing')
          s = s.replace(mobile_check, mobile_cleanup, 1)
          p.write_text(s)
          PY
          python3 scripts/one-shot-retire-personal-seo.py

      - name: Normalize exact-gap wiring and retired-surface test expectations
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          selection = Path('src/features/gaps/selection.ts')
          text = selection.read_text()
          text = text.replace(
              '  return () => listeners.delete(listener);',
              '  return () => {\n    listeners.delete(listener);\n  };',
          )
          selection.write_text(text)

          grid_path = Path('src/components/TimetableGrid.tsx')
          grid = grid_path.read_text()
          grid = re.sub(r'\n\s*onEdit=\{onEditPersonal\}\n\s*onDelete=\{onDeletePersonal\}', '', grid)
          grid = re.sub(r'\n\s*onEditPersonal=\{onEditPersonal\}\n\s*onDeletePersonal=\{onDeletePersonal\}', '', grid)
          grid_path.write_text(grid)

          app_path = Path('src/routes/_app.tsx')
          app = app_path.read_text()
          exact_handler = '''              onOpenGapPlan={(gap) => {\n                queueGapPlanSelection(gap.id);\n                openGapPlan();\n              }}'''
          generic_handler = '''              onOpenGapPlan={() => {\n                openGapPlan();\n              }}'''
          if exact_handler in app:
              app = app.replace(exact_handler, generic_handler, 1)
          mobile_start = app.find('<MobileTimetable')
          mobile_end = app.find('/>', mobile_start)
          if mobile_start < 0 or mobile_end < 0:
              raise SystemExit('MobileTimetable usage not found')
          segment = app[mobile_start:mobile_end]
          if generic_handler.strip() not in segment:
              raise SystemExit('MobileTimetable generic gap handler not found')
          segment = segment.replace(generic_handler.strip(), exact_handler.strip(), 1)
          app = app[:mobile_start] + segment + app[mobile_end:]
          app_path.write_text(app)

          branding_path = Path('tests/auth-branding.test.ts')
          branding = branding_path.read_text()
          old_brand = '      name: "Gapwise for UTM",\n'
          if old_brand not in branding:
              raise SystemExit('auth-branding manifest expectation not found')
          branding = branding.replace(old_brand, '      name: "Gapwise",\n', 1)
          branding_path.write_text(branding)

          restoration_path = Path('tests/restoration-flow.test.tsx')
          restoration = restoration_path.read_text()
          old_name = '  test("applies personal items from the same encrypted private payload as the schedule", async () => {'
          new_name = '  test("accepts legacy personal items in encrypted payloads without exposing them in the timetable", async () => {'
          if old_name not in restoration:
              raise SystemExit('legacy personal restoration test name not found')
          restoration = restoration.replace(old_name, new_name, 1)
          old_assertions = '''    await waitFor(() => pageText().includes("Restored study block"), "the restored personal item");
              expect(pageText()).toContain("PRIVATE101H5");'''
          if old_assertions not in restoration:
              pattern = re.compile(
                  r'\s*await waitFor\(\(\) => pageText\(\)\.includes\("Restored study block"\), "the restored personal item"\);\s*expect\(pageText\(\)\)\.toContain\("PRIVATE101H5"\);'
              )
              replacement = '''
              await waitFor(() => pageText().includes("PRIVATE101H5"), "the restored timetable");
              expect(pageText()).not.toContain("Restored study block");
              expect(loadCalls).toEqual([authenticatedUser.id]);'''
              restoration, count = pattern.subn(replacement, restoration, count=1)
              if count != 1:
                  raise SystemExit('legacy personal restoration assertions not found')
          else:
              restoration = restoration.replace(
                  old_assertions,
                  '''    await waitFor(() => pageText().includes("PRIVATE101H5"), "the restored timetable");
              expect(pageText()).not.toContain("Restored study block");
              expect(loadCalls).toEqual([authenticatedUser.id]);''',
                  1,
              )
          restoration_path.write_text(restoration)
          PY

      - name: Generate canonical favicon and social image
        shell: bash
        run: |
          set -euo pipefail
          cp public/icon-192.png public/favicon-192x192.png
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y imagemagick
          fi
          convert -size 1200x630 xc:'#0B1118' \
            \( public/icon-512.png -resize 220x220 \) -geometry +90+188 -composite \
            -fill '#4EA7FE' -draw 'rectangle 0,0 1200,8' \
            -font DejaVu-Sans-Bold -pointsize 92 -fill '#F7FAFC' -gravity northwest -annotate +365+190 'Gapwise' \
            -font DejaVu-Sans -pointsize 34 -fill '#B7C3D0' -gravity northwest -annotate +370+310 'Make the time between classes count.' \
            -font DejaVu-Sans -pointsize 25 -fill '#7F91A4' -gravity northwest -annotate +372+382 'University of Toronto Mississauga' \
            public/og-gapwise.png
          identify public/favicon-192x192.png public/og-gapwise.png

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed sources
        shell: bash
        run: |
          bunx prettier --write \
            src/styles.css src/routes/_app.tsx src/components/TimetableGrid.tsx \
            src/components/mobile/MobileTimetable.tsx src/components/GapPlan.tsx \
            src/components/LegalPage.tsx src/components/PublicFeaturePage.tsx \
            src/features/gaps/selection.ts src/features/schedule/use-selected-schedule-context.ts \
            src/content/public-feature-pages.ts src/routes/about.tsx src/routes/utm-timetable.tsx \
            src/routes/campus-map.tsx src/routes/gap-planner.tsx src/routes/campus-routing.tsx \
            src/routes/acorn-import.tsx src/routes/support.tsx scripts/build-seo-pages.ts scripts/check-seo-output.ts \
            tests/seo.test.ts tests/personal-items-retired.test.ts tests/auth-branding.test.ts \
            tests/restoration-flow.test.tsx e2e/clickable-gaps.e2e.ts \
            package.json vercel.json public/site.webmanifest index.html README.md \
            docs/CLOUDFLARE_PAGES.md docs/TRUST_DATA_INVENTORY.md e2e/trust-auth-academic.e2e.ts

      - name: Generate route tree and verify SEO build output
        run: bun run build

      - name: Format generated route tree
        run: bunx prettier --write src/routeTree.gen.ts

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit and integration tests
        run: bun test

      - name: Final production build
        run: bun run build

      - name: Formatting gate
        run: bunx prettier --check .

      - name: Remove one-shot machinery and commit validated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/one-shot-retire-personal-seo.py
          rm -f .github/workflows/one-shot-clickable-gaps-seo.yml
          rm -f .github/workflows/one-shot-clickable-gaps-seo-v2.yml
          git add -A
          git status --short
          git config user.name 'gapwise-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: retire personal items and strengthen Gapwise SEO'
          git push origin HEAD:feat/clickable-gaps-brand-seo
