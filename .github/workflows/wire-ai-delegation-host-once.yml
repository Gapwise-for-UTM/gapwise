name: Wire AI delegation host once

on:
  push:
    branches:
      - feat/account-ai-settings-v2
    paths:
      - .github/workflows/wire-ai-delegation-host-once.yml

permissions:
  contents: write

jobs:
  patch-and-remove:
    # This workflow is intentionally self-removing after one deterministic source edit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-ai-settings-v2
          fetch-depth: 0

      - name: Mount the AI delegation controller at app level
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/routes/_app.tsx")
          text = path.read_text()

          imports = '''import { AccountStatus } from "@/features/auth/AccountStatus";
          import { useAuth } from "@/features/auth/use-auth";'''.replace("          ", "")
          imports_next = '''import { AccountStatus } from "@/features/auth/AccountStatus";
          import { useAuth } from "@/features/auth/use-auth";
          import { registerAiDelegationController } from "@/features/ai/controller-bridge";
          import { useAiDelegation } from "@/features/ai/use-ai-delegation";'''.replace("          ", "")
          assert text.count(imports) == 1, "expected account/auth import block exactly once"
          text = text.replace(imports, imports_next, 1)

          anchor = '''  const applyPrivateData = useCallback((payload: PrivateDataPayloadV1) => {
            latestMeetings.current = payload.schedule;
            setMeetings(payload.schedule);
            setPersonalItems(payload.personalItems);
            setPreferences(payload.preferences);
            setGapPreferences(payload.gapPreferences);
            setWarnings([]);
            setError(null);
            setIsDemo(false);
            lastEncryptedFingerprint.current = JSON.stringify(payload);
          }, []);
          '''.replace("          ", "")
          replacement = anchor + '''
          const aiController = useAiDelegation({
            userId: authenticatedUserId,
            meetings,
            personalItems,
            preferences,
            gapPreferences,
            isDemo,
            onPrivateDataChange: applyPrivateData,
          });

          useEffect(() => registerAiDelegationController(aiController), [aiController]);
          '''.replace("          ", "")
          assert text.count(anchor) == 1, "expected applyPrivateData block exactly once"
          assert "const aiController = useAiDelegation" not in text, "AI controller already mounted"
          text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY

      - name: Remove this one-time workflow
        run: git rm .github/workflows/wire-ai-delegation-host-once.yml

      - name: Commit app-level wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app.tsx
          git commit -m "refactor: keep AI delegation mounted across app routes"
          git push origin HEAD:feat/account-ai-settings-v2
