name: Format live MiWay branch

on:
  push:
    branches:
      - feat/live-miway-and-github-redirects
    paths:
      - .github/workflows/format-live-miway-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/live-miway-and-github-redirects
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Fix live-layer lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/components/CampusMap.tsx')
          s = p.read_text()

          anchor = '  const stopMiWayLayerRef = useRef<(() => void) | null>(null);\n'
          if 'const liveBusesEnabledRef = useRef(false);' not in s:
              if anchor not in s:
                  raise SystemExit('missing stopMiWayLayerRef anchor')
              s = s.replace(anchor, anchor + '  const liveBusesEnabledRef = useRef(false);\n', 1)

          effect = '  useEffect(() => {\n    liveLocationRef.current = liveLocation;\n  }, [liveLocation]);\n'
          if 'liveBusesEnabledRef.current = liveBusesEnabled;' not in s:
              if effect not in s:
                  raise SystemExit('missing liveLocationRef effect anchor')
              s = s.replace(
                  effect,
                  effect + '\n  useEffect(() => {\n    liveBusesEnabledRef.current = liveBusesEnabled;\n  }, [liveBusesEnabled]);\n',
                  1,
              )

          pattern = r'if \(!liveBusesEnabled\)\s+map\.setMinZoom\(campusMinimumZoom\(map, campusCameraBounds\)\);'
          replacement = 'if (!liveBusesEnabledRef.current) {\n            map.setMinZoom(campusMinimumZoom(map, campusCameraBounds));\n          }'
          s, count = re.subn(pattern, replacement, s, count=1)
          if count != 1 and 'if (!liveBusesEnabledRef.current)' not in s:
              raise SystemExit('missing camera-limit anchor')

          if '  }, [attempt, liveBusesEnabled]);' in s:
              s = s.replace('  }, [attempt, liveBusesEnabled]);', '  }, [attempt]);', 1)
          elif '  }, [attempt]);' not in s:
              raise SystemExit('missing map-effect dependency anchor')

          p.write_text(s)
          PY
      - name: Format touched source
        run: bunx prettier --write src/components/CampusMap.tsx src/features/transit/miway-live-layer.ts src/features/transit/miway-live-layer.css src/server/miway.ts api/health.ts vercel.json public/_redirects
      - name: Commit fixes
        run: |
          git config user.name 'gapwise-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/CampusMap.tsx src/features/transit/miway-live-layer.ts src/features/transit/miway-live-layer.css src/server/miway.ts api/health.ts vercel.json public/_redirects
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep live bus toggle zero-reinit and formatted'
          git push origin HEAD:feat/live-miway-and-github-redirects
