name: Fix AND implementation runner

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/fix-implement-workflow.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Correct expected weekday maps and retrigger implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/and-120-121-implement.yml')
          text = path.read_text()
          old = 'if text.count("WEEKDAYS.map((day) => {") != 2:'
          new = 'if text.count("WEEKDAYS.map((day) => {") != 3:'
          if text.count(old) != 1:
              raise SystemExit('implementation workflow anchor not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/fix-implement-workflow.yml').unlink()
          PY
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git add -A
          git commit -m "chore: correct implementation runner"
          git push origin HEAD:andrewamuratov/and-120-and-121-weekend-shortest-routes
