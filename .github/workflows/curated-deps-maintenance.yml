name: Curated dependency maintenance

on:
  push:
    branches:
      - chore/curated-dependency-maintenance-aug17

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/curated-dependency-maintenance-aug17
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Update curated dependency set
        run: |
          bun add @supabase/supabase-js@^2.112.3 \
            @tanstack/react-router@^1.170.28 \
            @tanstack/react-start@^1.168.45 \
            @tanstack/router-plugin@^1.168.31 \
            maplibre-gl@^6.3.0
          bun add -d @lovable.dev/vite-tanstack-config@2.13.1 \
            eslint-plugin-react-refresh@0.5.4 \
            globals@^17.11.0 \
            typescript-eslint@8.67.0 \
            @types/node@^24
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "deps: apply curated launch-safe updates"
          git push origin HEAD:chore/curated-dependency-maintenance-aug17
