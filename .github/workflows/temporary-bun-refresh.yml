name: Temporary Bun dependency refresh

on:
  push:
    branches:
      - maintenance/bun-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Refresh dependency graph with Bun
        run: |
          bun remove recharts
          bun add lucide-react@1.31.0
          bun add --dev @vitejs/plugin-react@6.0.5 eslint@10.8.1 eslint-plugin-react-refresh@0.5.3
          bun install --frozen-lockfile
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh Bun dependencies [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
