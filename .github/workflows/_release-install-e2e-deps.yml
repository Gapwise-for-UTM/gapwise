name: Release dependency bootstrap

on:
  push:
    branches: [release/v1.0.0]
    paths:
      - .github/workflows/_release-install-e2e-deps.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun add -d @playwright/test @axe-core/playwright
      - name: Commit dependency lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Dependencies already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "test: add Playwright and axe dependencies"
          git push origin HEAD:release/v1.0.0
