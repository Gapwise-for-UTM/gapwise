name: AND-144 format cleanup

on:
  push:
    branches:
      - cleanup/and-144-retire-legacy-entitlements

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cleanup/and-144-retire-legacy-entitlements
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched TypeScript files
        run: bunx prettier --write src/routes/_app.tsx src/features/academic/AcademicWorkDialog.tsx tests/academic-private-state.test.ts

      - name: Verify entitlement remnants are gone from active source
        shell: bash
        run: |
          if git grep -n -E 'features/entitlements|Gapwise Pro|Gapwise Free|Plan & billing' -- src tests; then
            echo 'Retired entitlement or paid-plan copy remains in active source/tests.' >&2
            exit 1
          fi

      - name: Typecheck focused result
        run: bun run typecheck

      - name: Commit formatted result and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/and-144-format.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_app.tsx src/features/academic/AcademicWorkDialog.tsx tests/academic-private-state.test.ts
          git commit -m "cleanup: format entitlement removal"
          git push origin HEAD:cleanup/and-144-retire-legacy-entitlements
