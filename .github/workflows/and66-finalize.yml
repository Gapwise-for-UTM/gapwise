name: AND-66 Finalize Draft

on:
  push:
    branches: [feat/and-66-first-run-onboarding-draft]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Apply final AND-66 integration cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          p = Path("src/components/UploadPanel.tsx")
          text = p.read_text()
          text = text.replace('        <span className="sr-only">Upload your ACORN calendar</span>\n', '')
          text = text.replace('                <span className="sr-only">Try a demo</span>\n', '')
          p.write_text(text)

          p = Path("src/features/onboarding/first-value.ts")
          text = p.read_text()
          text = text.replace(
              '    const emphasisTimer = window.setTimeout(() => {\n      setArrival((current) => ({ ...current, emphasize: false }));\n    }, 600);\n',
              ''
          )
          text = text.replace('      window.clearTimeout(emphasisTimer);\n', '')
          p.write_text(text)

          replace_exact(
              "src/components/mobile/MobileMoreSheet.tsx",
              '  canRemove = true,\n  children,\n}: {\n',
              '  canRemove = true,\n  children,\n  syncControls,\n}: {\n'
          )
          replace_exact(
              "src/components/mobile/MobileMoreSheet.tsx",
              '  /** Existing account, theme, and residence controls, rendered unchanged. */\n  children: ReactNode;\n}) {\n',
              '  /** Existing account, theme, and residence controls, rendered unchanged. */\n  children: ReactNode;\n  /** Optional post-value private-sync controls. Never shown by the caller before a timetable exists. */\n  syncControls?: ReactNode;\n}) {\n'
          )
          replace_exact(
              "src/components/mobile/MobileMoreSheet.tsx",
              '          <div className="flex flex-wrap items-center gap-2">{children}</div>\n          <div className="space-y-2 border-t border-border pt-4">\n',
              '          <div className="flex flex-wrap items-center gap-2">{children}</div>\n          {syncControls ? <div className="border-t border-border pt-4">{syncControls}</div> : null}\n          <div className="space-y-2 border-t border-border pt-4">\n'
          )

          replace_exact(
              "src/routes/_app.tsx",
              '''          onRemoveTimetable={() => {\n            setMoreOpen(false);\n            confirmRemoveTimetable();\n          }}\n        >\n''',
              '''          onRemoveTimetable={() => {\n            setMoreOpen(false);\n            confirmRemoveTimetable();\n          }}\n          syncControls={\n            meetings ? (\n              <CloudSyncControls\n                user={user}\n                meetings={meetings}\n                personalItems={personalItems}\n                preferences={preferences}\n                gapPreferences={gapPreferences}\n                onLoad={loadCloudTimetable}\n                onLoadPrivate={loadPrivateData}\n                restorationState={restoration}\n              />\n            ) : null\n          }\n        >\n'''
          )
          PY
      - name: Format and autofix AND-66 files
        run: |
          FILES=(
            e2e/and66.e2e.ts
            src/components/TodaySummary.tsx
            src/components/UploadPanel.tsx
            src/components/mobile/MobileMoreSheet.tsx
            src/components/mobile/MobileToday.tsx
            src/components/onboarding/first-run.css
            src/features/onboarding/first-value.ts
            src/features/sync/CloudSyncControls.tsx
            src/routes/_app.timetable.tsx
            src/routes/_app.tsx
            tests/restoration-flow.test.tsx
            tests/upload-panel.test.tsx
          )
          bunx prettier --write "${FILES[@]}"
          bunx eslint --fix "${FILES[@]}"
          bunx prettier --write "${FILES[@]}"
      - name: Run focused static checks
        run: |
          bun run typecheck
          bun run lint
          bunx prettier --check .
      - name: Commit finalizer output
        run: |
          if git diff --quiet; then
            echo "No finalizer changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/and66.e2e.ts \
            src/components/TodaySummary.tsx \
            src/components/UploadPanel.tsx \
            src/components/mobile/MobileMoreSheet.tsx \
            src/components/mobile/MobileToday.tsx \
            src/components/onboarding/first-run.css \
            src/features/onboarding/first-value.ts \
            src/features/sync/CloudSyncControls.tsx \
            src/routes/_app.timetable.tsx \
            src/routes/_app.tsx \
            tests/restoration-flow.test.tsx \
            tests/upload-panel.test.tsx
          git commit -m "fix: finalize AND-66 activation flow"
          git push origin HEAD:feat/and-66-first-run-onboarding-draft
