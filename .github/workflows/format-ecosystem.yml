name: Format ecosystem files

on:
  push:
    branches:
      - chore/ecosystem-integration-2026-09

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply repository prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/ECOSYSTEM_INTEGRATION.md docs/SDK_RELEASE.md gapwise.ecosystem.json sdk/javascript/jsr.json
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ECOSYSTEM_INTEGRATION.md docs/SDK_RELEASE.md gapwise.ecosystem.json sdk/javascript/jsr.json
          git commit -m "style: apply repository prettier"
          git push origin HEAD:chore/ecosystem-integration-2026-09
