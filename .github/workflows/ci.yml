name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.detect.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect runtime changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/workflows/ci.yml)
                ;;
              *)
                runtime=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  security-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan reachable history and production exposure boundaries
        run: node scripts/scan-security-exposure.mjs

  quality:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun run security:audit
      - name: Verify API, OpenAPI, SDK, and maintained docs conformance
        run: bun run contract:check
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run typecheck
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run lint
      - if: needs.changes.outputs.runtime == 'true'
        run: bun test
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run build
      - run: bunx prettier --check .

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bun inside the Playwright image
        run: npm install --global bun@1.3.14
      - run: bun install --frozen-lockfile
      - name: Exercise release browser journeys
        run: bun run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  database-security:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - name: Apply migrations to an isolated Postgres instance
        run: supabase db start
      - name: Exercise friendship, overlap, RLS, and deletion policies
        run: supabase test db
      - name: Lint database functions and policies
        run: supabase db lint --local --level warning --fail-on error

  sdks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Build and test JavaScript SDK
        run: |
          cd sdk/javascript
          bun run build
          bun test
          bun pm pack --dry-run
          bun pm pack
          PACKAGE=$(find . -maxdepth 1 -name '*.tgz' -printf '%f\n')
          test -n "$PACKAGE"
          mkdir -p "$RUNNER_TEMP/js-consumer"
          cd "$RUNNER_TEMP/js-consumer"
          npm init --yes
          npm install "$GITHUB_WORKSPACE/sdk/javascript/$PACKAGE"
          node --input-type=module -e 'import { Gapwise } from "@gapwise/sdk"; if (!(new Gapwise({ fetch: globalThis.fetch }) instanceof Gapwise)) process.exit(1)'
      - name: Validate JSR package and Deno runtime
        working-directory: sdk/javascript
        run: |
          npx --yes jsr publish --dry-run
          deno check --no-config --unstable-sloppy-imports src/index.ts
          deno eval --no-config --unstable-sloppy-imports 'import { Gapwise } from "./src/index.ts"; const client = new Gapwise({ fetch: globalThis.fetch }); if (!(client instanceof Gapwise)) Deno.exit(1)'
      - name: Build and test Python SDK
        run: |
          python -m pip install './sdk/python[test]'
          black --check sdk/python
          ruff check sdk/python
          python -m pytest sdk/python
          python -m build sdk/python
          python -m twine check sdk/python/dist/*
          python -m venv "$RUNNER_TEMP/python-consumer"
          "$RUNNER_TEMP/python-consumer/bin/pip" install sdk/python/dist/*.whl
          "$RUNNER_TEMP/python-consumer/bin/python" -c 'from gapwise import Gapwise, AsyncGapwise; assert Gapwise and AsyncGapwise'
          unzip -l sdk/python/dist/*.whl | tee "$RUNNER_TEMP/wheel-contents.txt"
          grep 'gapwise/py.typed' "$RUNNER_TEMP/wheel-contents.txt"

  verify:
    runs-on: ubuntu-latest
    needs: [changes, security-exposure, quality, e2e, database-security, sdks]
    if: always()
    steps:
      - name: Require the appropriate validation gates
        env:
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          SECURITY_EXPOSURE_RESULT: ${{ needs.security-exposure.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DATABASE_RESULT: ${{ needs.database-security.result }}
          SDKS_RESULT: ${{ needs.sdks.result }}
        run: |
          test "$SECURITY_EXPOSURE_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"

          if [ "$RUNTIME_CHANGED" = "true" ]; then
            test "$E2E_RESULT" = "success"
            test "$DATABASE_RESULT" = "success"
            test "$SDKS_RESULT" = "success"
          else
            test "$E2E_RESULT" = "skipped"
            test "$DATABASE_RESULT" = "skipped"
            test "$SDKS_RESULT" = "skipped"
          fi
