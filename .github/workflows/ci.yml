name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.detect.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Detect runtime changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runtime=false
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE.md|.github/workflows/ci.yml)
                ;;
              *)
                runtime=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run typecheck
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run lint
      - if: needs.changes.outputs.runtime == 'true'
        run: bun test
      - if: needs.changes.outputs.runtime == 'true'
        run: bun run build
      - if: needs.changes.outputs.runtime == 'true'
        name: Verify generated icons
        run: bun test tests/icons.test.ts
      - run: bunx prettier --check .

  e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Exercise release browser journeys
        run: bun run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  database-security:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.113.0
      - name: Apply migrations to an isolated Postgres instance
        run: supabase db start
      - name: Exercise friendship, overlap, RLS, and deletion policies
        run: supabase test db
      - name: Lint database functions and policies
        run: supabase db lint --local --level warning --fail-on error

  verify:
    runs-on: ubuntu-latest
    needs: [changes, quality, e2e, database-security]
    if: always()
    steps:
      - name: Require the appropriate validation gates
        env:
          RUNTIME_CHANGED: ${{ needs.changes.outputs.runtime }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          DATABASE_RESULT: ${{ needs.database-security.result }}
        run: |
          test "$QUALITY_RESULT" = "success"

          if [ "$RUNTIME_CHANGED" = "true" ]; then
            test "$E2E_RESULT" = "success"
            test "$DATABASE_RESULT" = "success"
          else
            test "$E2E_RESULT" = "skipped"
            test "$DATABASE_RESULT" = "skipped"
          fi
