name: AND-120 E2E test fix

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-120-e2e-test-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Scope Gap Plan assertions to the visible panel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("e2e/core.e2e.ts")
          text = path.read_text()
          old = '''  await viewMode.getByRole("button", { name: "Gap plan" }).click();
  await expect(page.getByText("Saturday", { exact: true }).first()).toBeVisible();
  await expect(page.getByText(/2 hr/).first()).toBeVisible();
'''
          new = '''  await viewMode.getByRole("button", { name: "Gap plan" }).click();
  const gapPlan = page.locator(".dot-field:not([hidden])");
  await expect(gapPlan.getByText("Saturday", { exact: true }).first()).toBeVisible();
  await expect(gapPlan.getByText(/2 hr/).first()).toBeVisible();
'''
          if text.count(old) != 1:
              raise SystemExit("weekend Gap Plan assertion anchor missing")
          path.write_text(text.replace(old, new))
          PY
          bunx prettier --write e2e/core.e2e.ts
          bunx eslint e2e/core.e2e.ts
      - name: Commit source-only test fix
        run: |
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git add e2e/core.e2e.ts
          git commit -m "test: scope weekend gap plan assertions"
          git push origin HEAD:andrewamuratov/and-120-and-121-weekend-shortest-routes
