name: AND-121 topology diagnosis

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-121-topology-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test geometric topology repairs around IB and DV
        run: |
          cat > /tmp/topology.ts <<'TS'
          import { DEFAULT_ROUTE_PREFERENCES } from "${{ github.workspace }}/src/config/routing.ts";
          import { UTM_ROUTING_GRAPH } from "${{ github.workspace }}/src/data/utm/campus.ts";
          import { findBestRoute } from "${{ github.workspace }}/src/features/routing/engine.ts";
          import type { RoutingEdge, RoutingGraph, RoutingNode } from "${{ github.workspace }}/src/features/routing/types.ts";

          const graph = structuredClone(UTM_ROUTING_GRAPH) as RoutingGraph;
          const nodeById = new Map(graph.nodes.map(n => [n.id,n]));
          const lat0 = 43.55 * Math.PI / 180;
          const sx = 111_320 * Math.cos(lat0), sy = 110_540;
          const xy = (n: RoutingNode) => [n.longitude! * sx, n.latitude! * sy] as const;
          const inCorridor = (n: RoutingNode) => n.longitude! >= -79.665 && n.longitude! <= -79.661 && n.latitude! >= 43.5475 && n.latitude! <= 43.552;
          const edges = graph.edges.filter(e => {
            if (e.environment !== "outdoor") return false;
            const a=nodeById.get(e.from), b=nodeById.get(e.to);
            return a?.longitude!==undefined && b?.longitude!==undefined && (inCorridor(a)||inCorridor(b));
          });
          function lineIntersection(a:RoutingNode,b:RoutingNode,c:RoutingNode,d:RoutingNode) {
            const [x1,y1]=xy(a),[x2,y2]=xy(b),[x3,y3]=xy(c),[x4,y4]=xy(d);
            const den=(x1-x2)*(y3-y4)-(y1-y2)*(x3-x4);
            if (Math.abs(den)<1e-9) return null;
            const t=((x1-x3)*(y3-y4)-(y1-y3)*(x3-x4))/den;
            const u=-((x1-x2)*(y1-y3)-(y1-y2)*(x1-x3))/den;
            if (t<=1e-5||t>=1-1e-5||u<=1e-5||u>=1-1e-5) return null;
            return {t,u,lon:a.longitude!+t*(b.longitude!-a.longitude!),lat:a.latitude!+t*(b.latitude!-a.latitude!)};
          }
          function projection(p:RoutingNode,a:RoutingNode,b:RoutingNode) {
            const [px,py]=xy(p),[ax,ay]=xy(a),[bx,by]=xy(b);
            const vx=bx-ax,vy=by-ay,vv=vx*vx+vy*vy;
            const t=Math.max(0,Math.min(1,((px-ax)*vx+(py-ay)*vy)/vv));
            const lon=a.longitude!+t*(b.longitude!-a.longitude!), lat=a.latitude!+t*(b.latitude!-a.latitude!);
            return {t,lon,lat,d:Math.hypot((p.longitude!-lon)*sx,(p.latitude!-lat)*sy)};
          }
          function addJunction(id:string, lon:number, lat:number, links:Array<{edge:RoutingEdge,t:number}>, extra?:RoutingNode) {
            const j:RoutingNode={id,kind:"path-intersection",buildingCode:null,floor:null,accessibility:"unknown",longitude:lon,latitude:lat};
            graph.nodes.push(j); nodeById.set(id,j);
            for (const {edge,t} of links) {
              graph.edges.push({...edge,id:`${id}:${edge.id}:a`,from:edge.from,to:id,distanceMeters:Math.max(.01,edge.distanceMeters*t)});
              graph.edges.push({...edge,id:`${id}:${edge.id}:b`,from:id,to:edge.to,distanceMeters:Math.max(.01,edge.distanceMeters*(1-t))});
            }
            if (extra) {
              graph.edges.push({id:`${id}:link:${extra.id}`,from:extra.id,to:id,distanceMeters:.01,environment:"outdoor",stairs:false,bidirectional:true,accessibility:"unknown"});
            }
          }
          let added=0;
          for (let i=0;i<edges.length;i++) {
            const e1=edges[i]!,a=nodeById.get(e1.from)!,b=nodeById.get(e1.to)!;
            for (let k=i+1;k<edges.length;k++) {
              const e2=edges[k]!;
              if (e1.from===e2.from||e1.from===e2.to||e1.to===e2.from||e1.to===e2.to) continue;
              const c=nodeById.get(e2.from)!,d=nodeById.get(e2.to)!;
              const cross=lineIntersection(a,b,c,d);
              if (cross) {
                addJunction(`diag-cross-${added++}`,cross.lon,cross.lat,[{edge:e1,t:cross.t},{edge:e2,t:cross.u}]);
                continue;
              }
              for (const p of [a,b]) {
                const pr=projection(p,c,d);
                if (pr.d<=0.05 && pr.t>1e-4 && pr.t<1-1e-4) {
                  addJunction(`diag-near-${added++}`,pr.lon,pr.lat,[{edge:e2,t:pr.t}],p);
                }
              }
              for (const p of [c,d]) {
                const pr=projection(p,a,b);
                if (pr.d<=0.05 && pr.t>1e-4 && pr.t<1-1e-4) {
                  addJunction(`diag-near-${added++}`,pr.lon,pr.lat,[{edge:e1,t:pr.t}],p);
                }
              }
            }
          }
          const endpoints=(code:string,g:RoutingGraph)=>g.nodes.filter(n=>n.kind==="building-entrance"&&n.buildingCode===code).map(n=>n.id);
          const prefs={...DEFAULT_ROUTE_PREFERENCES,mode:"fastest" as const};
          const before=findBestRoute(UTM_ROUTING_GRAPH,endpoints("IB",UTM_ROUTING_GRAPH),endpoints("DV",UTM_ROUTING_GRAPH),prefs)!;
          const after=findBestRoute(graph,endpoints("IB",graph),endpoints("DV",graph),prefs)!;
          console.log(`repairs=${added} before=${before.totalDistanceMeters.toFixed(2)} after=${after.totalDistanceMeters.toFixed(2)} saved=${(before.totalDistanceMeters-after.totalDistanceMeters).toFixed(2)}`);
          console.log(`after nodes=${after.nodes.map(n=>n.id).join(" -> ")}`);
          console.log(`after edges=${after.edges.map(e=>e.id).join(" -> ")}`);
          for (const e of after.edges.filter(e=>e.id.startsWith("diag-"))) console.log(`USED_DIAGNOSTIC ${e.id}`);
          TS
          bun /tmp/topology.ts
