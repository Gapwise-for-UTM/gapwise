name: AND-125 repair export E2E

on:
  push:
    branches:
      - codex/perform-pre-release-audit-on-gapwise
    paths:
      - ".github/workflows/and-125-fix-export-e2e.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Update remaining export E2E locators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("e2e/core.e2e.ts")
          text = path.read_text()
          old = 'page.getByRole("button", { name: "Export image" })'
          new = 'page.getByRole("button", { name: "Export timetable", exact: true })'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 remaining Export image locators, found {count}")
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/and-125-fix-export-e2e.yml
      - name: Commit and push focused fix
        run: |
          git config user.name "Andrew Muratov"
          git config user.email "andrewamuratov@gmail.com"
          git add e2e/core.e2e.ts .github/workflows/and-125-fix-export-e2e.yml
          git commit -m "test: update remaining export accessibility coverage"
          git push origin HEAD:codex/perform-pre-release-audit-on-gapwise
