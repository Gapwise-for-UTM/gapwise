name: Temporary Lucide migration

on:
  push:
    branches:
      - maintenance/bun-dependency-refresh

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replace removed brand icon with a neutral repository icon
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/auth/AccountStatus.tsx')
          text = path.read_text()
          text = text.replace('ChevronDown, Github, LogOut', 'ChevronDown, GitBranch, LogOut')
          text = text.replace('<Github className="h-4 w-4"', '<GitBranch className="h-4 w-4"')
          path.write_text(text)
          PY
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/AccountStatus.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: migrate removed Lucide GitHub icon [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
