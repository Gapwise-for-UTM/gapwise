name: UTM entrance discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/discover-osm-entrances.ts"
      - "scripts/build-osm-entrance-proposal.ts"
      - "src/data/utm/entrances.geojson"
      - "src/data/utm/building-footprints.ts"
      - "src/data/utm/footprints/**"
      - ".github/workflows/utm-entrance-discovery.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Discover current entrance-tagged OSM nodes
        run: bun scripts/discover-osm-entrances.ts
      - name: Build conservative entrance proposal
        run: bun scripts/build-osm-entrance-proposal.ts
      - name: Regenerate routing and access audit from proposal
        run: |
          cp artifacts/entrances.with-osm-discoveries.geojson src/data/utm/entrances.geojson
          bun scripts/generate-outdoor-routing.ts
          bun scripts/audit-campus-routing.ts
      - name: Verify focused entrance and routing contracts
        run: bun test tests/utm-entrance-registry.test.ts tests/utm-official-access.test.ts tests/building-explorer.test.ts
      - name: Show generated change scope
        run: git diff --stat && git diff --numstat
      - name: Commit reviewed unique OSM entrance matches
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/utm/entrances.geojson src/data/utm/outdoor-nodes.geojson src/data/utm/outdoor-edges.json src/data/utm/generated/campus-access-audit.json src/data/utm/generated/entrance-audit.geojson docs/CAMPUS_ACCESS_AUDIT.md
          if git diff --cached --quiet; then
            echo "No new reviewed entrance data to commit."
          else
            git commit -m "feat(utm): add newly mapped OSM entrances"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Upload entrance proposal and generated routing data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utm-osm-entrance-proposal
          path: |
            artifacts/utm-osm-entrance-candidates.json
            artifacts/utm-osm-entrance-candidates.md
            artifacts/entrances.with-osm-discoveries.geojson
            src/data/utm/outdoor-nodes.geojson
            src/data/utm/outdoor-edges.json
            src/data/utm/generated/campus-access-audit.json
            src/data/utm/generated/entrance-audit.geojson
            docs/CAMPUS_ACCESS_AUDIT.md
          if-no-files-found: error
          retention-days: 7
