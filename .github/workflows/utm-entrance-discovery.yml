name: UTM entrance discovery

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/discover-osm-entrances.ts"
      - "src/data/utm/entrances.geojson"
      - "src/data/utm/building-footprints.ts"
      - "src/data/utm/footprints/**"
      - ".github/workflows/utm-entrance-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Discover current entrance-tagged OSM nodes
        run: bun scripts/discover-osm-entrances.ts
      - name: Upload entrance discovery report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: utm-osm-entrance-candidates
          path: |
            artifacts/utm-osm-entrance-candidates.json
            artifacts/utm-osm-entrance-candidates.md
          if-no-files-found: error
          retention-days: 7
