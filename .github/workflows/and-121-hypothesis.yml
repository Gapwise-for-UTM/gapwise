name: AND-121 route hypothesis

on:
  push:
    branches:
      - andrewamuratov/and-120-and-121-weekend-shortest-routes
    paths:
      - ".github/workflows/and-121-hypothesis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Prove IB node-on-segment defect
        run: |
          cat > /tmp/hypothesis.ts <<'TS'
          import { DEFAULT_ROUTE_PREFERENCES } from "${{ github.workspace }}/src/config/routing.ts";
          import { UTM_ROUTING_GRAPH } from "${{ github.workspace }}/src/data/utm/campus.ts";
          import { findBestRoute } from "${{ github.workspace }}/src/features/routing/engine.ts";
          import type { RoutingEdge, RoutingGraph, RoutingNode } from "${{ github.workspace }}/src/features/routing/types.ts";

          const graph = structuredClone(UTM_ROUTING_GRAPH) as RoutingGraph;
          const nodes = new Map(graph.nodes.map((node) => [node.id, node]));
          const ib = nodes.get("osm-node-2383653565")!;
          const edgeIndex = graph.edges.findIndex((edge) => edge.id === "osm-way-1508614600-4");
          const edge = graph.edges[edgeIndex]!;
          const a = nodes.get(edge.from)!;
          const b = nodes.get(edge.to)!;
          const lat0 = ((ib.latitude! + a.latitude! + b.latitude!) / 3) * Math.PI / 180;
          const sx = 111_320 * Math.cos(lat0);
          const sy = 110_540;
          const px = ib.longitude! * sx, py = ib.latitude! * sy;
          const ax = a.longitude! * sx, ay = a.latitude! * sy;
          const bx = b.longitude! * sx, by = b.latitude! * sy;
          const vx = bx - ax, vy = by - ay;
          const t = Math.max(0, Math.min(1, ((px-ax)*vx + (py-ay)*vy) / (vx*vx+vy*vy)));
          const lon = a.longitude! + t * (b.longitude! - a.longitude!);
          const lat = a.latitude! + t * (b.latitude! - a.latitude!);
          const meters = Math.hypot((ib.longitude!-lon)*sx, (ib.latitude!-lat)*sy);
          console.log(`IB projection onto ${edge.id}: t=${t}, offset=${meters}m at ${lon},${lat}`);
          console.log(`edge endpoints=${edge.from},${edge.to}, edgeDistance=${edge.distanceMeters}`);

          const junction: RoutingNode = {
            id: "diagnostic-ib-junction",
            kind: "path-intersection",
            buildingCode: null,
            floor: null,
            accessibility: "unknown",
            longitude: lon,
            latitude: lat,
          };
          const split = (id:string, from:string, to:string, distanceMeters:number): RoutingEdge => ({
            ...edge,
            id,
            from,
            to,
            distanceMeters,
          });
          graph.nodes.push(junction);
          graph.edges.splice(edgeIndex, 1,
            split(`${edge.id}-a`, edge.from, junction.id, edge.distanceMeters * t),
            split(`${edge.id}-b`, junction.id, edge.to, edge.distanceMeters * (1-t)),
          );
          graph.edges.push({
            id: "diagnostic-ib-junction-link",
            from: ib.id,
            to: junction.id,
            distanceMeters: Math.max(0.01, meters),
            environment: "outdoor",
            stairs: false,
            bidirectional: true,
            accessibility: "unknown",
          });
          function endpoints(code:string) {
            return graph.nodes.filter(n => n.kind === "building-entrance" && n.buildingCode === code).map(n => n.id);
          }
          const before = findBestRoute(UTM_ROUTING_GRAPH, endpoints("IB"), endpoints("DV"), {...DEFAULT_ROUTE_PREFERENCES, mode:"fastest"})!;
          const after = findBestRoute(graph, endpoints("IB"), endpoints("DV"), {...DEFAULT_ROUTE_PREFERENCES, mode:"fastest"})!;
          console.log(`before=${before.totalDistanceMeters.toFixed(2)}m after=${after.totalDistanceMeters.toFixed(2)}m saved=${(before.totalDistanceMeters-after.totalDistanceMeters).toFixed(2)}m`);
          console.log(`after nodes=${after.nodes.map(n=>n.id).join(" -> ")}`);
          TS
          bun /tmp/hypothesis.ts
      - name: Inventory hard-coded weekday assumptions
        run: |
          echo '=== getDay / five-column / copy assumptions ==='
          rg -n 'getDay\(\)|Monday through Friday|grid-cols-5|repeat\(5' src api sdk public tests e2e scripts || true
          echo '=== explicit weekday arrays/unions ==='
          rg -n 'Monday.*Tuesday.*Wednesday.*Thursday.*Friday' src api sdk public tests e2e scripts || true
