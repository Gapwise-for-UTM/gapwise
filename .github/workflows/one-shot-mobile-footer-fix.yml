name: One-shot compact mobile public navigation

on:
  push:
    branches:
      - feat/clickable-gaps-brand-seo

permissions:
  contents: write

concurrency:
  group: compact-mobile-public-navigation
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/clickable-gaps-brand-seo
          fetch-depth: 0
      - name: Compact the crawlable public navigation on narrow screens
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/routes/_app.tsx')
          text = path.read_text()
          old = 'className="mt-4 flex flex-wrap gap-x-4 gap-y-2 text-xs font-semibold"'
          new = 'className="mt-2 flex flex-nowrap gap-x-3 overflow-x-auto text-[0.65rem] font-semibold leading-none [scrollbar-width:none] sm:mt-4 sm:flex-wrap sm:gap-x-4 sm:gap-y-2 sm:overflow-visible sm:text-xs sm:leading-normal"'
          if old not in text:
            raise SystemExit('Explore Gapwise navigation class not found')
          text = text.replace(old, new, 1)
          text = text.replace(
            'className="hover:text-accent hover:underline"',
            'className="shrink-0 hover:text-accent hover:underline"',
          )
          path.write_text(text)
          PY
          bunx prettier --write src/routes/_app.tsx e2e/pwa.e2e.ts e2e/clickable-gaps.e2e.ts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run focused browser regression gates
        run: bunx playwright test e2e/and66.e2e.ts e2e/pwa.e2e.ts e2e/clickable-gaps.e2e.ts
      - name: Run source validation
        run: |
          bun run typecheck
          bun run lint
          bunx prettier --check .
      - name: Commit validated source and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-mobile-footer-fix.yml
          git add -A
          git config user.name 'gapwise-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep public navigation compact on mobile'
          git push origin HEAD:feat/clickable-gaps-brand-seo
