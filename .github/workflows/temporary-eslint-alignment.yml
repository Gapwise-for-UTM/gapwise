name: Temporary ESLint alignment

on:
  push:
    branches:
      - maintenance/bun-dependency-refresh

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Align ESLint 10 toolchain
        run: |
          bun add --dev @eslint/js@10.8.1 eslint-plugin-react-hooks@7.1.1 typescript-eslint@8.65.0
          bun install --frozen-lockfile
          bun run lint
      - name: Commit generated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No ESLint alignment changes to commit."
            exit 0
          fi
          git commit -m "chore: align ESLint 10 toolchain [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
