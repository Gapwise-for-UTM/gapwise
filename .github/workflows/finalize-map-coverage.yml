name: Finalize map marker and building coverage

on:
  push:
    branches: [fix/map-marker-stability-building-coverage]
    paths:
      - "scripts/finalize-map-coverage.py"
      - ".github/workflows/finalize-map-coverage.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Align reviewed Kaneff identity with current exact OSM feature
        run: |
          sed -i 's#way/478346172#way/1500300991#g' scripts/finalize-map-coverage.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('src/data/utm/building-footprint-overrides.json')
          data = json.loads(path.read_text())
          data['ways'].pop('478346172', None)
          data['ways']['1500300991'] = 'KN'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Build, verify, and push the consolidated map fix
        run: python3 scripts/finalize-map-coverage.py
