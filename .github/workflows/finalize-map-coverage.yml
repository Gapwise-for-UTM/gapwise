name: Finalize map marker and building coverage

on:
  push:
    branches: [fix/map-marker-stability-building-coverage]
    paths:
      - "scripts/finalize-map-coverage.py"
      - ".github/workflows/finalize-map-coverage.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Align reviewed shared-complex identities with current exact OSM features
        run: |
          sed -i 's#way/478346172#way/1500300991#g' scripts/finalize-map-coverage.py
          python3 - <<'PY'
          import json
          from pathlib import Path

          overrides = Path('src/data/utm/building-footprint-overrides.json')
          data = json.loads(overrides.read_text())
          data['ways'].pop('478346172', None)
          data['ways']['1500300991'] = 'KN'
          overrides.write_text(json.dumps(data, indent=2) + '\n')

          path = Path('src/data/utm/building-footprints.ts')
          text = path.read_text()
          needle = '''export const CAMPUS_BUILDING_FOOTPRINTS: CampusBuildingFootprintCollection = {\n  type: "FeatureCollection",\n  metadata: {'''
          helper = '''/**\n * UTM Facilities treats Kaneff Centre and Innovation Complex as distinct named\n * buildings at one shared public code/address. Current OSM geometry has the\n * Innovation footprint nested inside the broader Kaneff envelope, so make the\n * canonical interaction geometries mutually exclusive by cutting the exact\n * Innovation outer ring out of the exact Kaneff polygon as a hole. Both source\n * boundaries and source IDs remain authoritative; only hit-testing ownership is\n * partitioned.\n */\nfunction partitionSharedKaneffComplex(features: CampusBuildingFootprint[]) {\n  const kaneff = features.find((feature) => feature.properties.buildingCode === "KN");\n  const innovation = features.find((feature) => feature.properties.buildingCode === "IC");\n  if (!kaneff || !innovation) return features;\n\n  const innovationPolygons = geometryPolygons(innovation.geometry);\n  const kaneffPolygons = geometryPolygons(kaneff.geometry).map((polygon) => {\n    const outer = polygon[0];\n    if (!outer) return polygon;\n    const nestedRings = innovationPolygons\n      .map((candidate) => candidate[0])\n      .filter((ring): ring is FootprintCoordinate[] => Boolean(ring?.[0]))\n      .filter((ring) => pointInRing(ring[0]!, outer));\n    return nestedRings.length > 0 ? [...polygon, ...nestedRings] : polygon;\n  });\n\n  const partitionedKaneff: CampusBuildingFootprint = {\n    ...kaneff,\n    geometry:\n      kaneffPolygons.length === 1\n        ? { type: "Polygon", coordinates: kaneffPolygons[0]! }\n        : { type: "MultiPolygon", coordinates: kaneffPolygons },\n  };\n  validateGeometry("KN", partitionedKaneff.geometry);\n  return features.map((feature) =>\n    feature.properties.buildingCode === "KN" ? partitionedKaneff : feature,\n  );\n}\n\nexport const CAMPUS_BUILDING_FOOTPRINTS: CampusBuildingFootprintCollection = {\n  type: "FeatureCollection",\n  metadata: {'''
          if needle not in text:
              raise SystemExit('canonical footprint collection insertion point not found')
          text = text.replace(needle, helper, 1)
          text = text.replace('  features: mergeFragments(),', '  features: partitionSharedKaneffComplex(mergeFragments()),', 1)
          path.write_text(text)
          PY
      - name: Build, verify, and push the consolidated map fix
        run: python3 scripts/finalize-map-coverage.py
