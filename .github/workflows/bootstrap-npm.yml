name: Bootstrap npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-0.1.0 to publish @gapwise/sdk@0.1.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-bootstrap-0.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'publish-0.1.0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Verify exact package identity and build
        working-directory: sdk/javascript
        run: |
          test "$(node -p "require('./package.json').name")" = "@gapwise/sdk"
          test "$(node -p "require('./package.json').version")" = "0.1.0"
          bun run build
          bun test
          npm pack --dry-run
      - name: Publish @gapwise/sdk@0.1.0
        working-directory: sdk/javascript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish --access public
