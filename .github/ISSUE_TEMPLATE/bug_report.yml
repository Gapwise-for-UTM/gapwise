name: Bug report
description: Report a reproducible problem in Gapwise for UTM
title: "bug: "
labels:
  - Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Gapwise for UTM. Do not include credentials, access tokens, real timetable files, student numbers, or private floor plans. Report security vulnerabilities through the repository security policy instead of a public issue.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Import a synthetic or redacted calendar...
        3. Select...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Account mode
      options:
        - Guest mode
        - GitHub account
        - Email account
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, browser, and app URL.
      placeholder: iPhone 15, iOS 20, Safari, production
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Screenshots, console output, or links with personal information removed.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal timetable data, student numbers, and other private information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
