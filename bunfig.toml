[install]
saveTextLockfile = true
# 72h supply-chain guard: skip package versions published less than three days ago.
# This reduces exposure to newly published malicious packages before the ecosystem
# has had time to detect and yank them.
minimumReleaseAge = 259200
# Each entry bypasses the 72h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = ["@lovable.dev/vite-tanstack-config", "@lovable.dev/mcp-js", "@lovable.dev/vite-plugin-dev-server-bridge", "@lovable.dev/vite-plugin-hmr-gate", "@lovable.dev/email-js", "@lovable.dev/webhooks-js"]
