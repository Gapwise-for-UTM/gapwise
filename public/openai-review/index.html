<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
    <title>Gapwise — OpenAI plugin demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #090b0d; color: #f5f7f8; display: grid; place-items: center; padding: 32px 20px; }
      main { width: min(1120px, 100%); }
      header { margin-bottom: 18px; }
      .eyebrow { margin: 0 0 8px; color: #7dd3fc; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 38px); line-height: 1.1; }
      .sub { margin: 10px 0 0; color: #a8b0b7; line-height: 1.55; }
      .frame { overflow: hidden; border: 1px solid #252a2f; border-radius: 16px; background: #000; box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      video { display: block; width: 100%; height: auto; background: #000; }
      .status { padding: 13px 16px; color: #a8b0b7; border-top: 1px solid #20252a; font-size: 13px; }
      .status[data-ready="true"] { display: none; }
      footer { margin-top: 14px; color: #7f8992; font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Gapwise plugin review</p>
        <h1>OpenAI plugin functionality demo</h1>
        <p class="sub">A short recording showing ChatGPT using Gapwise to assess a synthetic U of T timetable and recommend study times.</p>
      </header>
      <section class="frame" aria-label="Gapwise plugin demonstration video">
        <video id="demo" controls playsinline preload="metadata" aria-label="Gapwise OpenAI plugin demo recording"></video>
        <div id="status" class="status">Loading demo recording…</div>
      </section>
      <footer>This recording uses synthetic timetable data and contains no real student schedule information.</footer>
    </main>
    <script src="/openai-review/player.js" defer></script>
  </body>
</html>
